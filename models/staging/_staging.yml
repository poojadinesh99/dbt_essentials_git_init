version: 2

models:
  - name: stg_jaffle_shop__customers
    description: One row per customer.
    columns:
      - name: customer_id
        description: Primary key.
        data_tests:
          - unique
          - not_null

  - name: stg_jaffle_shop__orders
    description: One row per order.
    columns:
      - name: order_id
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: status
        description: Order status.
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
      - name: customer_id
        description: Foreign key to customers.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id

  - name: stg_stripe__payments
    description: One row per payment attempt, amount in dollars.
    columns:
      - name: payment_id
        description: Primary key.
        data_tests:
          - unique
          - not_null